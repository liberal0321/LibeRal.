<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} | 株式会社LibeRal</title>

  <link rel="stylesheet" href="{{ site.baseurl }}/style.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/post.css">
</head>

<body>

  {% include header.html %}


  <main class="post-page">

    <section class="post-hero">

      <div class="post-hero-inner">

        <span class="post-category">
          {{ page.category }}
        </span>

        <h1>{{ page.title }}</h1>

        <time datetime="{{ page.date | date_to_xmlschema }}">
          {{ page.date | date: "%Y.%m.%d" }}
        </time>

      </div>

    </section>


    <article class="post-article">

      {% if page.image %}
      <div class="post-main-image">
        <img src="{{ site.baseurl }}{{ page.image }}" alt="{{ page.title }}">
      </div>
      {% endif %}


      <div class="post-content">

        {{ content }}

      </div>

      <div class="post-back">
        <a href="{{ site.baseurl }}/news.html">
          ← NEWS一覧へ戻る
        </a>
      </div>

    </article>

  </main>


  {% include footer.html variant='simple' copyright_years='2025-2026' %}


  <script>
    document.addEventListener("DOMContentLoaded", function(){
      const hamburger = document.getElementById("hamburger");
      const nav = document.getElementById("nav");
      const header = document.querySelector(".site-header");

      function updateHeader(){
        header.classList.toggle("scrolled", window.scrollY > 40);
      }

      updateHeader();
      window.addEventListener("scroll", updateHeader, { passive: true });

      if (hamburger) {
        hamburger.addEventListener("click", function(){
          const isOpen = nav.classList.toggle("active");
          hamburger.setAttribute("aria-expanded", isOpen);
          hamburger.setAttribute("aria-label", isOpen ? "メニューを閉じる" : "メニューを開く");

          document.querySelectorAll(".submenu").forEach(sub => {
            if (window.innerWidth <= 980) sub.style.display = "none";
          });
        });
      }

      document.querySelectorAll(".toggle-submenu").forEach(el => {
        const toggle = function(){
          if(window.innerWidth <= 980){
            const submenu = el.nextElementSibling;
            const isOpen = submenu.style.display === "block";
            submenu.style.display = isOpen ? "none" : "block";
            el.setAttribute("aria-expanded", !isOpen);
          }
        };

        el.addEventListener("click", toggle);
        el.addEventListener("keydown", function(e){
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggle();
          }
        });
      });
    });
  </script>

</body>
</html>
